  <rect x="24" y="564" width="3" height="32" rx="1.5" fill="#B98A1F"/>
  <text x="44" y="572" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#8A6A00">8:00 PM</text>
  <text x="44" y="596" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1D1B16">Weekly review &#183; quiet page</text>
