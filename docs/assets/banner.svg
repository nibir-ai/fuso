<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fuso — The journal that keeps up with your life">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1912"/>
      <stop offset="1" stop-color="#14110C"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB697"/>
      <stop offset="1" stop-color="#F5BE48"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.65">
      <stop offset="0" stop-color="#FFB697" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFB697" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- journal ruled-lines motif -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="872" y1="122" x2="1184" y2="122" stroke="url(#rule)"/>
    <line x1="872" y1="162" x2="1184" y2="162" stroke="url(#rule)"/>
    <line x1="872" y1="202" x2="1152" y2="202" stroke="url(#rule)"/>
    <line x1="872" y1="242" x2="1032" y2="242" stroke="url(#ink)"/>
    <rect x="1044" y="226" width="10" height="32" rx="3" fill="#F5BE48"/>
    <line x1="872" y1="282" x2="1096" y2="282" stroke="url(#rule)"/>
  </g>

  <!-- wordmark -->
  <text x="92" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="7" fill="#9B9080">JOURNAL &#183; NOTES &#183; MOOD &#183; INSIGHT</text>
  <text x="86" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="138" font-weight="700" letter-spacing="-3" fill="#F5F0E7">fuso<tspan fill="#FFB697">.</tspan></text>
  <text x="94" y="306" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="400" fill="#D2C7B4">The journal that keeps up with your life.</text>

  <!-- base accent line -->
  <rect x="94" y="344" width="76" height="5" rx="2.5" fill="url(#ink)"/>
</svg>
