<svg width="1280" height="420" viewBox="0 0 1280 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fuso — The journal that keeps up with your life">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201A12"/>
      <stop offset="1" stop-color="#14110C"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB697"/>
      <stop offset="1" stop-color="#F5BE48"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="-0.1" r="0.7">
      <stop offset="0" stop-color="#FFB697" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFB697" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1.1" r="0.75">
      <stop offset="0" stop-color="#F5BE48" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F5BE48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <style>
      .dot { animation: pulse 3.2s ease-in-out infinite alternate; }
      .cursor { animation: blink 1.15s steps(2, start) infinite; }
      .write {
        stroke-dasharray: 640;
        stroke-dashoffset: 640;
        animation: draw 2.6s cubic-bezier(.6,.05,.3,1) .4s forwards;
      }
      @keyframes pulse { from { opacity: 1; } to { opacity: .35; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glowB)"/>

  <!-- ghost serif letterform bleeding off canvas -->
  <text x="690" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="560" font-weight="700" fill="none" stroke="#F5F0E7" stroke-opacity="0.05" letter-spacing="-18">f</text>

  <!-- journal ruled-lines motif with live cursor -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="872" y1="122" x2="1184" y2="122" stroke="url(#rule)"/>
    <line x1="872" y1="164" x2="1184" y2="164" stroke="url(#rule)"/>
    <line x1="872" y1="206" x2="1148" y2="206" stroke="url(#rule)"/>
    <line x1="872" y1="248" x2="1032" y2="248" stroke="url(#ink)"/>
    <rect class="cursor" x="1044" y="232" width="10" height="32" rx="3" fill="#F5BE48"/>
    <line x1="872" y1="290" x2="1096" y2="290" stroke="url(#rule)"/>
  </g>

  <!-- wordmark block -->
  <text x="92" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="7" fill="#9B9080">OFFLINE-FIRST JOURNAL &#183; ANDROID</text>
  <text x="84" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="140" font-weight="700" letter-spacing="-3" fill="#F5F0E7">fuso<tspan class="dot" fill="#FFB697">.</tspan></text>
  <text x="94" y="308" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="400" fill="#D2C7B4">The journal that keeps up with your life.</text>

  <!-- self-drawing underline -->
  <path class="write" d="M96 346 C 180 338, 260 352, 350 344 S 520 338, 600 346" fill="none" stroke="url(#ink)" stroke-width="4" stroke-linecap="round"/>
</svg>
