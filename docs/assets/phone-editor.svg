<svg width="360" height="760" viewBox="0 0 360 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fuso block editor with slash menu">
  <defs>
    <filter id="ph2" x="-30%" y="-10%" width="160%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="panel" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3A342B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#ph2)">
    <rect x="4" y="4" width="352" height="752" rx="58" fill="#171310" stroke="#2A241C" stroke-width="2"/>
    <rect x="18" y="18" width="324" height="724" rx="44" fill="#FBF7F0"/>
  </g>
  <circle cx="180" cy="38" r="5" fill="#171310"/>

  <text x="44" y="62" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="#1D1B16">9:41</text>
  <g fill="#1D1B16">
    <rect x="278" y="52" width="3" height="6" rx="1"/><rect x="283" y="49" width="3" height="9" rx="1"/><rect x="288" y="46" width="3" height="12" rx="1"/>
    <rect x="300" y="47" width="22" height="11" rx="3" fill="none" stroke="#1D1B16" stroke-width="1.5"/><rect x="303" y="50" width="13" height="5" rx="1.5"/>
  </g>

  <!-- top bar -->
  <path d="M46 96l-7 8 7 8" fill="none" stroke="#1D1B16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="108" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="600" fill="#1D1B16">Journal</text>
  <path d="M310 100l5 6 9-12" fill="none" stroke="#A94F2C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- title -->
  <text x="32" y="152" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="700" fill="#1D1B16">Saturday in the mountains</text>
  <rect x="32" y="164" width="2" height="20" rx="1" fill="#A94F2C"/>

  <!-- blocks -->
  <text x="32" y="212" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#1D1B16">Trail notes</text>

  <text x="32" y="240" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#52483A">Left at dawn. Fog sat in the valley</text>
  <text x="32" y="260" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#52483A">until the first switchback.</text>

  <rect x="32" y="278" width="16" height="16" rx="4" fill="#A94F2C"/>
  <path d="M36 286l4 4 7-9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="291" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#1D1B16">Book the cabin</text>

  <rect x="32" y="306" width="16" height="16" rx="4" fill="none" stroke="#B8AD9C" stroke-width="1.6"/>
  <text x="58" y="319" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#52483A">Rent sleeping bags</text>

  <circle cx="38" cy="346" r="3" fill="#A94F2C"/>
  <text x="52" y="350" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#52483A">Coffee at the ridge lookout</text>
  <circle cx="38" cy="372" r="3" fill="#A94F2C"/>
  <text x="52" y="376" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#52483A">Write before the light goes</text>

  <rect x="32" y="398" width="3" height="52" rx="1.5" fill="#D9A93B"/>
  <text x="48" y="416" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#52483A">&#8220;We need the tonic of wildness&#8221;</text>
  <text x="48" y="444" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#9B9080">&#8212; Aldo Leopold</text>

  <!-- slash menu panel -->
  <g filter="url(#panel)">
    <rect x="84" y="474" width="208" height="138" rx="14" fill="#FFFFFF" stroke="#E4DED2"/>
  </g>
  <text x="100" y="498" font-family="'Consolas', monospace" font-size="14" font-weight="700" fill="#C96A3F">/</text>
  <text x="114" y="498" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#9B9080">Block</text>
  <line x1="96" y1="508" x2="280" y2="508" stroke="#F0E8DC"/>

  <g font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5">
    <text x="120" y="528" fill="#1D1B16">Text</text>
    <text x="120" y="556" fill="#1D1B16">Heading 2</text>
    <text x="120" y="584" fill="#1D1B16">To-do</text>
    <text x="120" y="606" fill="#52483A">Quote</text>
  </g>
  <rect x="92" y="566" width="192" height="26" rx="8" fill="#F5F0E7"/>
  <!-- row icons -->
  <g stroke="#7F7768" stroke-width="1.5" stroke-linecap="round">
    <line x1="100" y1="522" x2="112" y2="522"/><line x1="106" y1="522" x2="106" y2="531"/>
    <text x="99" y="559" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="700" fill="#7F7768" stroke="none">H&#8322;</text>
    <rect x="100" y="572" width="10" height="10" rx="2.5" fill="none"/><path d="M102.5 577l2.5 2.5 4-5" fill="none"/>
    <text x="101" y="608" font-family="Georgia, serif" font-size="13" fill="#7F7768" stroke="none">&#8220;&#8221;</text>
  </g>

  <!-- keyboard -->
  <rect x="18" y="618" width="324" height="124" fill="#F1EBDF"/>
  <g fill="#E4DDCF">
    <g>
      <rect x="26" y="628" width="26" height="34" rx="6"/><rect x="56" y="628" width="26" height="34" rx="6"/><rect x="86" y="628" width="26" height="34" rx="6"/><rect x="116" y="628" width="26" height="34" rx="6"/><rect x="146" y="628" width="26" height="34" rx="6"/><rect x="176" y="628" width="26" height="34" rx="6"/><rect x="206" y="628" width="26" height="34" rx="6"/><rect x="236" y="628" width="26" height="34" rx="6"/><rect x="266" y="628" width="26" height="34" rx="6"/><rect x="296" y="628" width="26" height="34" rx="6"/>
    </g>
    <rect x="26" y="666" width="34" height="34" rx="6"/><rect x="64" y="666" width="26" height="34" rx="6"/><rect x="94" y="666" width="26" height="34" rx="6"/><rect x="124" y="666" width="26" height="34" rx="6"/><rect x="154" y="666" width="26" height="34" rx="6"/><rect x="184" y="666" width="26" height="34" rx="6"/><rect x="214" y="666" width="26" height="34" rx="6"/><rect x="244" y="666" width="26" height="34" rx="6"/><rect x="274" y="666" width="48" height="34" rx="6"/>
    <rect x="26" y="704" width="42" height="34" rx="6"/><rect x="72" y="704" width="26" height="34" rx="6"/><rect x="102" y="704" width="130" height="34" rx="6"/><rect x="236" y="704" width="26" height="34" rx="6"/><rect x="266" y="704" width="56" height="34" rx="6"/>
  </g>
  <circle cx="180" cy="736" r="3" fill="#171310"/>
</svg>
