<svg width="1160" height="300" viewBox="0 0 1160 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fuso Quick Add parsing dates, times and events as you type">
  <defs>
    <style>
      .stage { animation: stage 12s ease-in-out infinite; }
      .hl1 { opacity: 0; animation: hl1 12s ease-out infinite; }
      .hl2 { opacity: 0; animation: hl2 12s ease-out infinite; }
      .c1, .c2, .c3 { opacity: 0; }
      .c1 { animation: c1 12s cubic-bezier(.2,.9,.3,1.2) infinite; }
      .c2 { animation: c2 12s cubic-bezier(.2,.9,.3,1.2) infinite; }
      .c3 { animation: c3 12s cubic-bezier(.2,.9,.3,1.2) infinite; }
      .caret { animation: blink 1.05s steps(2, start) infinite; }

      @keyframes blink { 50% { opacity: 0; } }
      @keyframes stage { 0%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes hl1 { 0%, 8% { opacity: 0; } 14%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes hl2 { 0%, 24% { opacity: 0; } 30%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
      @keyframes c1 { 0%, 40% { opacity: 0; transform: translateY(14px); } 48%, 92% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
      @keyframes c2 { 0%, 49% { opacity: 0; transform: translateY(14px); } 57%, 92% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
      @keyframes c3 { 0%, 58% { opacity: 0; transform: translateY(14px); } 66%, 92% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; } }
    </style>
    <clipPath id="round2"><rect width="1160" height="300" rx="24"/></clipPath>
    <style>
      text.seg { font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace; font-size: 27px; fill: #F5F0E7; }
    </style>
  </defs>

  <g clip-path="url(#round2)">
    <rect width="1160" height="300" fill="#15130E"/>

    <text x="48" y="54" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#F5BE48">QUICK ADD</text>
    <text x="1112" y="54" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="2" fill="#6B6252">LIVE PARSE</text>

    <g class="stage">
      <!-- highlight boxes: exact same geometry as the word segments below -->
      <rect x="276" y="84" width="144" height="34" rx="7" class="hl1" fill="#FFB697" fill-opacity="0.16"/>
      <rect x="424" y="84" width="106" height="34" rx="7" class="hl2" fill="#F5BE48" fill-opacity="0.18"/>

      <!-- input line, segmented so words always land inside their boxes -->
      <text class="seg" x="48"   y="108" textLength="220" lengthAdjust="spacingAndGlyphs">Lunch with dad</text>
      <text class="seg" x="284"  y="108" textLength="128" lengthAdjust="spacingAndGlyphs">tomorrow</text>
      <text class="seg" x="430"  y="108" textLength="28"  lengthAdjust="spacingAndGlyphs">at</text>
      <text class="seg" x="474"  y="108" textLength="50"  lengthAdjust="spacingAndGlyphs">1pm</text>
      <rect x="536" y="86" width="3" height="30" rx="1.5" class="caret" fill="#FFB697"/>

      <!-- parsed chips -->
      <g class="c1">
        <rect x="48" y="168" width="224" height="44" rx="22" fill="none" stroke="#FFB697" stroke-width="1.5"/>
        <circle cx="76" cy="190" r="5" fill="#FFB697"/>
        <text x="94" y="196" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#FFB697" textLength="164" lengthAdjust="spacingAndGlyphs">Tomorrow &#183; Wed, Sep 2</text>
      </g>
      <g class="c2">
        <rect x="292" y="168" width="170" height="44" rx="22" fill="none" stroke="#F5BE48" stroke-width="1.5"/>
        <circle cx="320" cy="190" r="5" fill="#F5BE48"/>
        <text x="338" y="196" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#F5BE48" textLength="110" lengthAdjust="spacingAndGlyphs">1:00 PM &#183; Event</text>
      </g>
      <g class="c3">
        <rect x="482" y="168" width="168" height="44" rx="22" fill="none" stroke="#6B6252" stroke-width="1.5"/>
        <path d="M506 198l6 6 10-12" fill="none" stroke="#B8AD9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="532" y="196" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#B8AD9C" textLength="104" lengthAdjust="spacingAndGlyphs">saved offline</text>
      </g>

      <text x="48" y="258" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#9B9080">Dates, times and events &#8212; understood while you type. No forms, no pickers.</text>
    </g>
  </g>
  <rect width="1160" height="300" rx="24" fill="none" stroke="#2A241C" stroke-width="1.5"/>
</svg>
