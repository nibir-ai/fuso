  <text x="62" y="592" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#7F7768">The Fremen survive because&#8230;</text>
  <text x="324" y="572" text-anchor="end" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#9B9080">Yesterday</text>

