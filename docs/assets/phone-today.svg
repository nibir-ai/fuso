  <circle cx="48" cy="648" r="5" fill="#7A5900"/>
  <text x="62" y="646" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1D1B16">Gym &#8212; squat day</text>
  <text x="62" y="666" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#7F7768">120 kg &#215; 5, felt strong.</text>
  <text x="324" y="646" text-anchor="end" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#9B9080">Yesterday</text>

